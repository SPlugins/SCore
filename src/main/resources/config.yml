locale: EN # Lang available:  AR, DE, EN, ES, FR, ID, RU, ZH
useMySQL: false
dbIP: 127.0.0.1
dbPort: 3306
dbName: myDB
dbUser: root
dbPassword: rootPassword
reduceDamageIndicatorWithProtolcolLib: false # if you have ProtocolLib installed, you can reduce the damage indicator amount (The amount of hearts that are displayed when you take damage)
silenceOutputs: # You can blacklist sentences that are sent to the console by The Ssomar plugins
  - "blacklist the sentence here"
globalSilenceOutputs: # You can blacklist sentences that are sent to the console by any plugin
  - "blacklist the sentence here"
disableCustomMetadataOnEntities: false # to disable the metadata fromSpawner and bowForce to be added to entities
beforeDeathIgnoreCancelledDamage: false # true: PLAYER_BEFORE_DEATH and ENTITY_BEFORE_DEATH are checked after the other plugins and don't run when one of them cancelled the damage (a damage cap, a protected region...)

#MIN : it will save only the modified settings
#NORMAL : it will save modified settings + frequently used settings
#MAX : it will save all settings (its very verbose)
configVerbosity: "NORMAL" # "NORMAL" or "MIN" or "MAX"
enableCommentsInConfig: true # It will add a description of each setting in comment in the yaml config file.
editorIconPreview: true # Shows the name, lore, enchantments and attributes of each object on its icon in the list editors (/ei editor ...). Bounded, display only.
breakChains: true # A block broken by a command (score run-block-command ... BREAK) runs the activators of the item again, which can break other blocks, and so on (stopped at 64 levels / 512 blocks). false: only the blocks broken by the commands of the activator itself, like BREAK
selfHostPackDebug : false
selfHostPackIp: "" # The IP of your server to self-hosted your textures pack. If you leave it empty, it will try to get your IP automatically.
hologramsPlugin: "NONE" # The holograms plugin you want to use. By default None , it uses the vanilla holograms. You can use CMI, HOLOGRAPHIC_DISPLAYS or DECENT_HOLOGRAMS

# Custom entity and block lists
# Define reusable lists that can be referenced with SCORE: prefix in detailedEntities and detailedBlocks
# Example usage in item config: detailedEntities: [SCORE:ANNOYING_MOBS, ZOMBIE]
entityLists:
  ANNOYING_MOBS:
    - CAMEL
    - STRAY
    - DROWNED
  HOSTILE_MOBS:
    - ZOMBIE
    - SKELETON
    - CREEPER
    - SPIDER

blockLists:
  STUPID_BLOCKS:
    - BARRIER
    - BEDROCK
    - DIAMOND_ORE
  ORES:
    - COAL_ORE
    - IRON_ORE
    - GOLD_ORE
    - DIAMOND_ORE
    - EMERALD_ORE
# SCore Screens: menus drawn in front of the player (text displays), with a chest menu when that is not possible.
# Nothing opens a screen unless you run a command that uses it (for example /score hub).
screens:
  enabled: true
  # AUTO = PINNED (panel fixed to the camera, needs the pack below) if possible, else FLOATING (1.19.4+), else CHEST
  prefer-mode: AUTO
  # PINNED needs the small SCore Screens resource pack (cursor shader, 1.21.4+). true = send it to the players who have
  # the permission score.hub only (on top of your other packs, they can refuse it). Other players never receive it.
  pinned-pack: false
  # Screen ids or plugin names always shown as a chest menu, example: [ "splugins:hub" ]
  forced-chest: []

# SPlugins Hub (/score hub, /splugins): dashboard of your SPlugins plugins, help, news. Permission score.hub (OP).
hub:
  # Add the /splugins command if no other plugin uses it
  splugins-alias: true
  # Read the public SPlugins catalog (versions, packs, news) with an anonymous request. Nothing about your server is sent.
  remote-catalog: true
  # Show a clickable line to the players with score.hub when they join
  join-notification: false
  # Remind the players with score.hub to leave a review after some days
  review-reminder: false
  review-reminder-days: 14
  # Paper 1.21.6+: add a "SPlugins Hub" button in the pause menu and the quick actions (a datapack is written in the
  # main world, restart needed). Vanilla shows the button to every player; it opens the Hub only for score.hub.
  pause-menu-button: false

# SPlugins assistant (Hub > Assistant tab, permission score.hub). Off by default. When on, an admin links this server
# to a splugins.net account once (a code to enter on splugins.net/dashboard/servers); questions then use that
# account's plan. Sent with each question: the question, the plugin versions and the load errors (shown in the
# question window). The assistant can read the configurations of the SPlugins plugins and check them with the real
# loaders. For admins with the permission score.ai.write (op by default) it can also propose a change of a file:
# the admin sees the diff in the game and nothing is written before they click Apply; a backup is kept in
# plugins/SCore/ai-backups/ and the change can be undone from the Hub or with /score hub ai undo.
# Each admin's current conversation (last 10 exchanges) is kept in plugins/SCore/ai-conversations/ so it can be
# resumed from the Hub ("Resume the conversation"), even after a restart; "New conversation" deletes it.
ai:
  enabled: false
  url: "https://splugins.net/api/v1/server"
  # name shown in "Linked servers" on splugins.net (empty = the server's MOTD)
  server-name: ""
